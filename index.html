<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f5f7" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Thời Khóa Biểu Gia Đình</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --ink: #15202b;
      --muted: #66788a;
      --line: #e4e9ee;
      --green: #1f5c45;
      --green-soft: #e7f3ec;
      --weekend: #fdecee;
      --weekend-ink: #c2414a;
      --sang: #9a541c;
      --chieu: #1a6b7c;
      --shadow: 0 8px 28px rgba(21, 32, 43, 0.06);
      --radius: 22px;
      --ui: "Segoe UI", "Be Vietnam Pro", system-ui, sans-serif;
      --display: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); }
    body { padding: 28px 22px 56px; }
    .wrap { max-width: 1280px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    h1 { font-family: var(--display); font-size: clamp(1.8rem, 3vw, 2.35rem); margin: 0; letter-spacing: -0.02em; }
    .badge-src { background: #e8edf2; color: var(--muted); font-size: 0.78rem; padding: 6px 12px; border-radius: 999px; }
    .today-line { margin: 6px 0 0; font-size: 0.92rem; }
    .hint { margin: 6px 0 18px; color: var(--muted); font-size: 0.9rem; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .pill { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; }
    .pill .dot { width: 9px; height: 9px; border-radius: 50%; }
    .pill.on { background: var(--green); color: #fff; border-color: var(--green); }
    .board {
      background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .board::-webkit-scrollbar { height: 10px; }
    .board::-webkit-scrollbar-thumb { background: #c5d0d8; border-radius: 99px; }
    table.grid { border-collapse: separate; border-spacing: 0; min-width: 980px; width: 100%; }
    .grid th, .grid td { vertical-align: top; }
    .grid thead th { padding: 14px 10px 12px; font-weight: 650; border-bottom: 1px solid var(--line); background: #fafbfc; }
    .grid thead th .sub { display: block; color: var(--muted); font-size: 0.75rem; font-weight: 500; margin-top: 2px; }
    .grid thead th.today { background: var(--green-soft); color: var(--green); }
    .grid thead th.weekend { background: var(--weekend); color: var(--weekend-ink); }
    .now { display: inline-block; margin-left: 6px; font-size: 0.62rem; background: var(--green); color: #fff; border-radius: 999px; padding: 2px 7px; }
    .lab {
      width: 54px; color: #fff; font-weight: 700; font-size: 0.88rem;
      text-align: center; writing-mode: vertical-rl; transform: rotate(180deg);
      letter-spacing: 0.08em; position: sticky; left: 0; z-index: 2;
    }
    .grid thead th:first-child { position: sticky; left: 0; z-index: 3; background: #fafbfc; }
    td.lab-sang { background: var(--sang); }
    td.lab-chieu { background: var(--chieu); }
    td.cell { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px; min-width: 132px; }
    tr.sang td.cell.today, tr.chieu td.cell.today { background: #f3faf6; }
    tr.sang td.cell.weekend, tr.chieu td.cell.weekend { background: #fff7f7; }
    .chip { border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--line); background: #fff; font-size: 0.84rem; }
    .chip.uncertain { background: #ffe566; border-color: #e6c200; }
    .chip .who { font-weight: 700; font-size: 0.72rem; margin-bottom: 2px; }
    .chip .tm { color: var(--muted); font-size: 0.75rem; }
    .empty { color: var(--muted); font-size: 0.8rem; }
    .foot { margin-top: 16px; color: var(--muted); font-size: 0.82rem; line-height: 1.5; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .ghost { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 650; cursor: pointer; font: inherit; }
    @media (max-width: 860px) {
      body { padding: 16px 12px 40px; }
      .top { flex-direction: column; align-items: flex-start; }
    }
    @media print {
      body { background: #fff; padding: 0; }
      .pills, .actions, .hint, .badge-src { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Thời Khóa Biểu Gia Đình</h1>
      <div class="badge-src" id="src">Đang tải GitHub…</div>
    </div>
    <p class="today-line" id="today-line"></p>
    <p class="hint">Chỉ xem. Đổi lịch thì sửa <code>data.json</code> rồi push GitHub, sau đó bấm <strong>Làm mới</strong> (tránh cache trình duyệt).</p>
    <div class="pills" id="pills"></div>
    <div class="board"><table class="grid" id="grid"></table></div>
    <div class="actions">
      <button class="ghost" type="button" id="btn-reload">Làm mới</button>
      <button class="ghost" type="button" id="btn-today">Về tuần này</button>
      <button class="ghost" type="button" id="btn-share">Sao chép link</button>
    </div>
    <p class="foot">Ô vàng = chữ giấy chưa xác nhận.</p>
  </div>
  <script>
    const SLOTS = [{ id: "sang", label: "Sáng" }, { id: "chieu", label: "Chiều" }];
    const DAYS = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ nhật"];
    const KEYS = ["t2", "t3", "t4", "t5", "t6", "t7", "cn"];
    const state = {
      person: "chung",
      weekStart: startOfWeek(new Date()),
      people: [],
      events: {},
      uncertain: []
    };

    function startOfWeek(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
      return x;
    }
    function iso(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function fmtVN(d) {
      return d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
    }
    function weekDates() {
      return KEYS.map((_, i) => {
        const d = new Date(state.weekStart);
        d.setDate(state.weekStart.getDate() + i);
        return d;
      });
    }
    function isToday(d) { return iso(d) === iso(new Date()); }
    function isWeekend(i) { return i >= 5; }
    function personById(id) { return state.people.find((p) => p.id === id); }
    function listAt(pid, day, slot) {
      return (((state.events[pid] || {})[day] || {})[slot]) || [];
    }
    function isUnc(pid, day, slot, idx) {
      return state.uncertain.indexOf(pid + "|" + day + "|" + slot + "|" + idx) >= 0;
    }

    function chip(pid, day, slot, ev, idx) {
      const el = document.createElement("div");
      el.className = "chip" + (isUnc(pid, day, slot, idx) ? " uncertain" : "");
      const p = personById(pid);
      const who = (state.person === "chung" && p)
        ? '<div class="who" style="color:' + p.color + '">' + p.name + "</div>"
        : "";
      el.innerHTML = who +
        '<div class="tm">' + (ev.start || "—") + " → " + (ev.end || "—") + "</div>" +
        "<div>" + (ev.title || "") + "</div>";
      return el;
    }
    function fillSlot(host, day, slotId) {
      let n = 0;
      const ids = state.person === "chung" ? state.people.map((p) => p.id) : [state.person];
      ids.forEach((pid) => {
        listAt(pid, day, slotId).forEach((ev, idx) => {
          host.appendChild(chip(pid, day, slotId, ev, idx));
          n++;
        });
      });
      if (!n) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "—";
        host.appendChild(e);
      }
    }

    function renderPills() {
      const box = document.getElementById("pills");
      box.innerHTML = "";
      [{ id: "chung", name: "Lịch chung", color: "#1f5c45" }].concat(state.people).forEach((p) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pill" + (state.person === p.id ? " on" : "");
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = p.color;
        b.appendChild(dot);
        b.appendChild(document.createTextNode(p.name));
        b.addEventListener("click", () => { state.person = p.id; render(); });
        box.appendChild(b);
      });
    }

    function renderGrid() {
      const dates = weekDates();
      const table = document.getElementById("grid");
      table.innerHTML = "";
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      hr.appendChild(document.createElement("th"));
      dates.forEach((d, i) => {
        const th = document.createElement("th");
        th.className = isToday(d) ? "today" : (isWeekend(i) ? "weekend" : "");
        th.innerHTML = DAYS[i] + (isToday(d) ? '<span class="now">HÔM NAY</span>' : "") +
          '<span class="sub">' + fmtVN(d) + "</span>";
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      const tb = document.createElement("tbody");
      SLOTS.forEach((slot) => {
        const tr = document.createElement("tr");
        tr.className = slot.id;
        const lab = document.createElement("td");
        lab.className = "lab lab-" + slot.id;
        lab.textContent = slot.label;
        tr.appendChild(lab);
        dates.forEach((d, i) => {
          const td = document.createElement("td");
          td.className = "cell" + (isToday(d) ? " today" : "") + (isWeekend(i) ? " weekend" : "");
          fillSlot(td, KEYS[i], slot.id);
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      table.appendChild(tb);
    }

    function render() {
      const now = new Date();
      document.getElementById("today-line").innerHTML =
        "<strong>Hôm nay:</strong> " + DAYS[(now.getDay() + 6) % 7] + ", " + fmtVN(now);
      renderPills();
      renderGrid();
    }

    async function load() {
      try {
        Object.keys(localStorage).forEach((k) => {
          if (k.indexOf("tkb-gia-dinh") === 0) localStorage.removeItem(k);
        });
      } catch (e) {}
      const res = await fetch("data.json?ts=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const doc = await res.json();
      state.people = doc.people || [];
      state.events = doc.events || {};
      state.uncertain = doc.uncertain || [];
      const n = Date.now();
      const t = new Date(n);
      const hh = String(t.getHours()).padStart(2, "0");
      const mm = String(t.getMinutes()).padStart(2, "0");
      document.getElementById("src").textContent = "GitHub · " + hh + ":" + mm;
      render();
    }

    document.getElementById("btn-reload").addEventListener("click", () => {
      document.getElementById("src").textContent = "Đang tải…";
      load().catch(() => {
        document.getElementById("src").textContent = "Lỗi tải data.json";
      });
    });
    document.getElementById("btn-today").addEventListener("click", () => {
      state.weekStart = startOfWeek(new Date());
      render();
    });
    document.getElementById("btn-share").addEventListener("click", async () => {
      const url = location.origin + location.pathname.replace(/index\.html$/, "");
      try { await navigator.clipboard.writeText(url); document.getElementById("src").textContent = "Đã copy link"; }
      catch (e) { prompt("Link:", url); }
    });

    load().catch(() => {
      document.getElementById("src").textContent = "Lỗi tải data.json";
    });
  </script>
</body>
</html>
