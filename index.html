<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f5f7" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Thời Khóa Biểu Gia Đình</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --ink: #15202b;
      --muted: #66788a;
      --line: #e4e9ee;
      --green: #1f5c45;
      --green-soft: #e7f3ec;
      --weekend: #fdecee;
      --weekend-ink: #c2414a;
      --sang: #9a541c;
      --chieu: #1a6b7c;
      --toi: #2b3a67;
      --shadow: 0 8px 28px rgba(21, 32, 43, 0.06);
      --radius: 22px;
      --ui: "Segoe UI", "Be Vietnam Pro", system-ui, sans-serif;
      --display: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); }
    body { padding: 28px 22px 56px; }
    .wrap { max-width: 1280px; margin: 0 auto; }
    .top { display: flex; justify-content: flex-start; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    h1 { font-family: var(--display); font-size: clamp(1.8rem, 3vw, 2.35rem); margin: 0; letter-spacing: -0.02em; }
    .top-actions { display: flex; flex-direction: row; align-items: center; gap: 10px; }
    .btn-reload {
      background: var(--green); color: #fff; border: 0; cursor: pointer;
      font: inherit; font-weight: 700; font-size: 1.02rem;
      padding: 12px 22px; border-radius: 999px;
      box-shadow: 0 8px 18px rgba(31, 92, 69, 0.3);
    }
    .btn-reload:hover { background: #164736; }
    .btn-reload:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    .badge-src { background: #e8edf2; color: var(--muted); font-size: 0.78rem; padding: 6px 12px; border-radius: 999px; }
    .today-line { margin: 6px 0 14px; font-size: 0.92rem; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .pill { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; }
    .pill .dot { width: 9px; height: 9px; border-radius: 50%; }
    .pill.on { background: var(--green); color: #fff; border-color: var(--green); }
    .pill.on .dot { background: #fff !important; }
    .pill:focus-visible, .btn-reload:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .board {
      background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .board::-webkit-scrollbar { height: 10px; }
    .board::-webkit-scrollbar-thumb { background: #c5d0d8; border-radius: 99px; }
    table.grid { border-collapse: separate; border-spacing: 0; min-width: 980px; width: 100%; }
    .grid th, .grid td { vertical-align: top; }
    .grid td.lab { vertical-align: middle; }
    .grid thead th { padding: 14px 10px 12px; font-weight: 650; border-bottom: 1px solid var(--line); background: #fafbfc; }
    .grid thead th .sub { display: block; color: var(--muted); font-size: 0.75rem; font-weight: 500; margin-top: 2px; }
    .grid thead th.today { background: var(--green-soft); color: var(--green); }
    .grid thead th.weekend { background: var(--weekend); color: var(--weekend-ink); }
    .grid thead th.today.weekend { background: var(--green-soft); color: var(--green); }
    .now { display: inline-block; margin-left: 6px; font-size: 0.62rem; background: var(--green); color: #fff; border-radius: 999px; padding: 2px 7px; }
    .lab {
      width: 54px; color: #fff; font-weight: 700; font-size: 0.88rem;
      letter-spacing: 0.08em;
      position: sticky; left: 0; z-index: 2;
      vertical-align: middle;
    }
    .lab span {
      writing-mode: vertical-rl; transform: rotate(180deg);
      display: block; margin: 0 auto; line-height: 1.2;
    }
    .grid thead th:first-child { position: sticky; left: 0; z-index: 3; background: #fafbfc; }
    td.lab-sang { background: var(--sang); }
    td.lab-chieu { background: var(--chieu); }
    td.lab-toi { background: var(--toi); }
    td.cell { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px; min-width: 132px; }
    tr.sang td.cell.today, tr.chieu td.cell.today, tr.toi td.cell.today { background: #f3faf6; }
    tr.sang td.cell.weekend, tr.chieu td.cell.weekend, tr.toi td.cell.weekend { background: #fff7f7; }
    .chip { border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--line); background: #fff; font-size: 0.84rem; }
    .chip.uncertain { background: #ffe566; border-color: #e6c200; }
    .chip .who { font-weight: 700; font-size: 0.72rem; margin-bottom: 2px; }
    .chip .tm { color: var(--muted); font-size: 0.75rem; }
    .empty { color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 860px) {
      body { padding: 16px 12px 40px; }
      .top { align-items: center; }
      .btn-reload { font-size: 0.95rem; padding: 11px 18px; }
    }
    @media print {
      body { background: #fff; padding: 0; }
      .pills, .badge-src, .btn-reload { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Thời Khóa Biểu Gia Đình</h1>
      <div class="top-actions">
        <button class="btn-reload" type="button" id="btn-reload">Làm mới</button>
        <div class="badge-src" id="src">Đang tải GitHub…</div>
      </div>
    </div>
    <p class="today-line" id="today-line"></p>
    <div class="pills" id="pills"></div>
    <div class="board"><table class="grid" id="grid"></table></div>
  </div>
  <script>
    const SLOTS = [
      { id: "sang", label: "Sáng" },
      { id: "chieu", label: "Chiều" },
      { id: "toi", label: "Tối" }
    ];
    const DAYS = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ nhật"];
    const KEYS = ["t2", "t3", "t4", "t5", "t6", "t7", "cn"];
    const state = {
      person: "chung",
      weekStart: startOfWeek(new Date()),
      people: [],
      events: {},
      uncertain: []
    };

    function startOfWeek(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
      return x;
    }
    function iso(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function fmtVN(d) {
      return d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
    }
    function weekDates() {
      return KEYS.map((_, i) => {
        const d = new Date(state.weekStart);
        d.setDate(state.weekStart.getDate() + i);
        return d;
      });
    }
    function isToday(d) { return iso(d) === iso(new Date()); }
    function isWeekend(i) { return i >= 5; }
    function personById(id) { return state.people.find((p) => p.id === id); }
    function dayEvents(pid, day) {
      const bag = (state.events[pid] || {})[day];
      if (Array.isArray(bag)) return bag;
      if (!bag || typeof bag !== "object") return [];
      const out = [];
      ["sang", "chieu", "toi"].forEach(function (slot) {
        (bag[slot] || []).forEach(function (ev) { out.push(ev); });
      });
      return out;
    }
    function toMin(t) {
      if (t === "24:00") return 24 * 60;
      const p = String(t || "00:00").split(":");
      return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
    }
    function fromMin(n) {
      if (n >= 24 * 60) return "24:00";
      const h = Math.floor(n / 60);
      const m = n % 60;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }
    const SLOT_RANGE = {
      sang: ["00:00", "12:00"],
      chieu: ["12:00", "18:00"],
      toi: ["18:00", "24:00"]
    };
    function clipToSlot(ev, slotId) {
      const r = SLOT_RANGE[slotId];
      if (!r || !ev.start || !ev.end) return null;
      const a = Math.max(toMin(ev.start), toMin(r[0]));
      const b = Math.min(toMin(ev.end), toMin(r[1]));
      if (b <= a) return null;
      return { start: fromMin(a), end: fromMin(b), title: ev.title };
    }
    function isUnc(pid, day, idx) {
      return state.uncertain.indexOf(pid + "|" + day + "|" + idx) >= 0;
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }
    function chip(pid, day, ev, idx) {
      const el = document.createElement("div");
      el.className = "chip" + (isUnc(pid, day, idx) ? " uncertain" : "");
      const p = personById(pid);
      const who = (state.person === "chung" && p)
        ? '<div class="who" style="color:' + esc(p.color) + '">' + esc(p.name) + "</div>"
        : "";
      el.innerHTML = who +
        '<div class="tm">' + esc(ev.start || "—") + " → " + esc(ev.end || "—") + "</div>" +
        "<div>" + esc(ev.title || "") + "</div>";
      return el;
    }
    function fillSlot(host, day, slotId) {
      let n = 0;
      const ids = state.person === "chung" ? state.people.map((p) => p.id) : [state.person];
      ids.forEach((pid) => {
        dayEvents(pid, day).forEach(function (ev, orig) {
          const clipped = clipToSlot(ev, slotId);
          if (!clipped) return;
          host.appendChild(chip(pid, day, clipped, orig));
          n++;
        });
      });
      if (!n) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "—";
        host.appendChild(e);
      }
    }

    function renderPills() {
      const box = document.getElementById("pills");
      box.innerHTML = "";
      [{ id: "chung", name: "Lịch chung", color: "#1f5c45" }].concat(state.people).forEach((p) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pill" + (state.person === p.id ? " on" : "");
        b.setAttribute("aria-pressed", state.person === p.id ? "true" : "false");
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = p.color;
        b.appendChild(dot);
        b.appendChild(document.createTextNode(p.name));
        b.addEventListener("click", () => { state.person = p.id; render(); });
        box.appendChild(b);
      });
    }

    function renderGrid() {
      const dates = weekDates();
      const table = document.getElementById("grid");
      table.innerHTML = "";
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      hr.appendChild(document.createElement("th"));
      dates.forEach((d, i) => {
        const th = document.createElement("th");
        const cls = [];
        if (isToday(d)) cls.push("today");
        if (isWeekend(i)) cls.push("weekend");
        th.className = cls.join(" ");
        th.innerHTML = DAYS[i] + (isToday(d) ? '<span class="now">HÔM NAY</span>' : "") +
          '<span class="sub">' + fmtVN(d) + "</span>";
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      const tb = document.createElement("tbody");
      SLOTS.forEach((slot) => {
        const tr = document.createElement("tr");
        tr.className = slot.id;
        const lab = document.createElement("td");
        lab.className = "lab lab-" + slot.id;
        lab.innerHTML = "<span>" + slot.label + "</span>";
        tr.appendChild(lab);
        dates.forEach((d, i) => {
          const td = document.createElement("td");
          td.className = "cell" + (isToday(d) ? " today" : "") + (isWeekend(i) ? " weekend" : "");
          fillSlot(td, KEYS[i], slot.id);
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      table.appendChild(tb);
    }

    function render() {
      const now = new Date();
      document.getElementById("today-line").innerHTML =
        "<strong>Hôm nay:</strong> " + DAYS[(now.getDay() + 6) % 7] + ", " + fmtVN(now);
      renderPills();
      renderGrid();
    }

    async function load() {
      try {
        Object.keys(localStorage).forEach((k) => {
          if (k.indexOf("tkb-gia-dinh") === 0) localStorage.removeItem(k);
        });
      } catch (e) {}
      const res = await fetch("data.json?ts=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const doc = await res.json();
      state.people = doc.people || [];
      state.events = doc.events || {};
      state.uncertain = doc.uncertain || [];
      const n = Date.now();
      const t = new Date(n);
      const hh = String(t.getHours()).padStart(2, "0");
      const mm = String(t.getMinutes()).padStart(2, "0");
      document.getElementById("src").textContent = "GitHub · " + hh + ":" + mm;
      render();
    }

    document.getElementById("btn-reload").addEventListener("click", () => {
      const u = new URL(location.href);
      u.searchParams.set("v", String(Date.now()));
      location.replace(u.toString());
    });

    load().catch(() => {
      document.getElementById("src").textContent = "Lỗi tải data.json";
    });
  </script>
</body>
</html>
